services:
  # 1. The Database Service
  mongo:
    image: mongo:7.0
    container_name: lostfound_mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  # 2. The Express Backend Service
  server:
    build: ./server
    container_name: lostfound_server
    restart: always
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongo:27017/lost_and_found
      - JWT_SECRET=super_secret_jwt_key_lost_and_found_2026
    depends_on:
      - mongo
    volumes:
      - uploads_data:/app/uploads

  # 3. The React + Nginx Frontend Service
  client:
    build: ./client
    container_name: lostfound_client
    restart: always
    ports:
      - "8080:80"
    depends_on:
      - server

  # 4. Prometheus (Metrics Collector)
  prometheus:
    image: prom/prometheus:latest
    container_name: lostfound_prometheus
    restart: always
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - server

  # 5. Grafana (Visual Metrics Dashboard)
  grafana:
    image: grafana/grafana:latest
    container_name: lostfound_grafana
    restart: always
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
    ports:
      - "3002:3000"
    depends_on:
      - prometheus

# Persistent Storage
volumes:
  mongo_data:
  uploads_data:
  prometheus_data:
  grafana_data: